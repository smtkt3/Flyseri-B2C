                        type: array
                        items:
                          properties:
                            EndNumber:
                              description: Used to specify the final EMD number when specifying a range.
                              example: 3
                              type: integer
                              format: int32
                            Number:
                              description: Used to specify an EMD number.
                              example: 1
                              type: integer
                              format: int32
                            itemId:
                              type: integer
                              format: int32
                              example: 1
                              description: |
                              
                                Used to specify air extra/ancillary item ID sourced from Booking Management API getBooking service.
                                
                                `itemId` cannot be combined with `Number` and/or `EndNumber`.
                              minimum: 1
                        minItems: 0
                      BaggageAllowance:
                        description: Can't be combined with `PhaseIV`.
                        type: array
                        items:
                          properties:
                            SegmentSelect:
                              description: Used to instruct the system to price specified itinerary segments.
                              properties:
                                EndNumber:
                                  description: Used to identify end of range for specified itinerary segments.
                                  example: 3
                                  type: integer
                                  format: int32
                                Number:
                                  description: Used to instruct the system to price specified itinerary segments.
                                  example: 1
                                  type: integer
                                  format: int32
                              required:
                                - Number
                            Number:
                              description: Used to specify the quantity of checked bags if applicable.
                              example: '01'
                              type: string
                            Weight:
                              description: Used to specify the weight in kilos of checked bags if applicable.
                              example: '20'
                              type: string
                        minItems: 0
                        maxItems: 99
                      Certificate:
                        description: Used to pss certificate numbers.
                        type: array
                        items:
                          properties:
                            Number:
                              description: Used to specify a ticket number. Only applicable to Sabre Sonic-hosted carriers.
                              example: '123456789'
                              type: string
                          required:
                            - Number
                        minItems: 0
                        maxItems: 2
                      Commission:
                        description: Used to pass details of the commission being claimed.
                        properties:
                          Amount:
                            description: Used to specify the numeric amount of commission being claimed if applicable.
                            example: 25
                            type: number
                            format: int32
                          Net:
                            description: If `true`, claims commission on the net fare. Must be combined with `Percent`.
                            example: true
                            type: boolean
                          Percent:
                            description: Used to specify the percentage of commission being claimed if applicable.
                            example: 5
                            type: number
                            format: int32
                      Discount:
                        description: Used to specify the discount.
                        properties:
                          Code:
                            description: Used to specify an 8 digit discount approval code.
                            type: string
                      DateOfBirth:
                        description: |
                          Used to instruct the system to take the passenger's date of birth-related information from the SSR PNR field
                          and pass it into the host-based ticketing application. This is required for clients based in the Russian Federation.
                        example: '2024-01-01'
                        type: string
                      Endorsement:
                        description: Used to pass miscellaneous text in the endorsements field.
                        properties:
                          Text:
                            description: Used to pass miscellaneous text in the endorsements field.
                            example: 'TEST0'
                            type: string
                          Override:
                            description: If `true`, overrides existing endorsement.
                            example: true
                            type: boolean
                        required:
                          - Text
                      FutureTicket:
                        description: Used to issue tickets from specific FP lines.
                        properties:
                          Line:
                            description: Line and its associated attributes are used to issue tickets from specific FP lines.
                            type: array
