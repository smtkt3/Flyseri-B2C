openapi: 3.0.0
info:
  title: Exchange Booking
  version: 1.1.0
  description: The Exchange Booking API is used to update the itinerary and create a single, or multiple, Price Quote
    Reissue (PQR) record(s) for a ticket exchange in a single API call.
servers:
  - url: https://api.cert.platform.sabre.com
security:
  - oauth2_authentication:
      []
tags:
  - name: Exchange Booking
    description: Update the itinerary and create a single, or multiple, Price Quote Reissue (PQR) record(s) for a ticket exchange.
paths:
  /v1.1.0/exchange/booking:
    post:
      operationId: exchangeBooking
      description: Update the itinerary and create a single, or multiple, Price Quote Reissue (PQR) record(s) for a ticket exchange.
      tags:
        - Exchange Booking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeBookingRequest'
            examples:
              requestExample:
                $ref: '#/components/examples/requestExample'
      responses:
        "200":
          description: Response success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeBookingResponse'
              examples:
                responseExample:
                  $ref: '#/components/examples/responseExample'
        "400":
          description: |
            Bad Request

            - The request was not valid.
        "404":
          description: |
            Not Found

            - No results were found.
