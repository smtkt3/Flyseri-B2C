                            description: Used to enter manual/NET amount.
                            example: '600'
                            type: string
                          DiscountAmount:
                            description: Used to enter discount amount.
                            example: '100'
                            type: string
                          SellingFareAmount:
                            description: Used to enter total selling amount.
                            example: '875.28'
                            type: string
                          ContractAgreementCode:
                            description: Used to enter manual NET/net code with contract agreement reference code.
                            example: 'ABCDEFGHIJ'
                            type: string
                          NetCreditAmount:
                            description: Used to enter credit card amount.
                            example: 20051.6
                            type: number
                            format: decimal
                          TourCode:
                            description: Used to pass tour code details.
                            example: 'TEST1212'
                            type: string
                          ValueCode:
                            description: Used to enter manual NET/net code with value code.
                            example: 'D2469'
                            type: string
                      Ticket:
                        description: Used to specify ticket types to issue.
                        properties:
                          Action:
                            description: Used to specify an action code. Only applicable to Sabre Sonic-hosted carriers.
                            example: 'PRINT'
                            type: string
                          Type:
                            description: |
                              Used to specify the type of ticket to issue.
                              Acceptable values for Type:
                              ETR = electronic ticket (default),
                              EMD = Electronic Miscellaneous Document,
                              XETR = paper ticket,
                              VCR = paper ticket (for airline use only).
                            example: 'ETR'
                            type: string
                      TourCode:
                        description: Used to pass tour code information.
                        properties:
                          SuppressFareReplaceWithBT:
                            description: Suppress the fare amount on the ticket and replace with BT.
                            properties:
                              Ind:
                                description: If `true`, suppresses the fare amount on the ticket and replaces it with BT.
                                example: true
                                type: boolean
                            required:
                              - Ind
                          SuppressFareReplaceWithIT:
                            description: Suppress the fare amount on the ticket and replace with IT.
                            properties:
                              Ind:
                                description: If `true`, suppresses the fare amount on the ticket and replaces it with IT.
                                example: true
                                type: boolean
                            required:
                              - Ind
                          SuppressIT:
                            description: Suppress the IT in the tour code box from printing.
                            properties:
                              Ind:
                                description: If `true`, suppresses the IT in the tour code box from printing.
                                example: true
                                type: boolean
                            required:
                              - Ind
                          SuppressITSupressFare:
                            description: Suppress IT from printing in the tour box on the ticket and to suppress fare amounts from printing on the ticket.
                            properties:
                              Ind:
                                description: If `true`, suppresses IT from printing in the tour box on the ticket and suppresses fare amounts from printing on the ticket.
                                example: true
                                type: boolean
                            required:
                              - Ind
                          Text:
                            description: Used to specify tour code.
                            example: 'TEST1212'
                            type: string
