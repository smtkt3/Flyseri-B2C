                                type: string
                              MaxPenalty:
                                description: |
                                  Used to specify a maximum change penalty. If set to `0`, no penalty is preferred.
                                  If set to `N`, only non-changeable options are requested.
                                  Decimals aren't allowed.
                                example: '100'
                                type: string
                              BeforeDeparture:
                                description: If `true`, queries for before departure fees.
                                example: true
                                type: boolean
                              AfterDeparture:
                                description: If `true`, queries for after departure fees.
                                example: true
                                type: boolean
                          EitherOr:
                            description: One object can't contain both `BeforeDeparture` and `AfterDeparture`.
                            properties:
                              Any:
                                description: If `true`, specifies only changeable fare options.
                                example: true
                                type: boolean
                              CurrencyCode:
                                description: Used to specify the specific currency for maximum exchange penalty.
                                example: 'USD'
                                type: string
                              MaxPenalty:
                                description: |
                                  Used to specify a maximum change penalty. If set to `0`, no penalty is preferred.
                                  If set to `N`, only non-changeable options are requested.
                                  Decimals aren't allowed.
                                example: '100'
                                type: string
                              BeforeDeparture:
                                description: If `true`, queries for before departure fees.
                                example: true
                                type: boolean
                              AfterDeparture:
                                description: If `true`, queries for after departure fees.
                                example: true
                                type: boolean
                          Refundable:
                            description: One object can't contain both `BeforeDeparture` and `AfterDeparture`.
                            properties:
                              Any:
                                description: If `true`, specifies only changeable fare options.
                                example: true
                                type: boolean
                              CurrencyCode:
                                description: Used to specify the specific currency for maximum exchange penalty.
                                example: 'USD'
                                type: string
                              MaxPenalty:
                                description: |
                                  Used to specify a maximum change penalty. If set to `0`, no penalty is preferred.
                                  If set to `N`, only non-changeable options are requested.
                                  Decimals aren't allowed.
                                example: '100'
                                type: string
                              BeforeDeparture:
                                description: If `true`, queries for before departure fees.
                                example: true
                                type: boolean
                              AfterDeparture:
                                description: If `true`, queries for after departure fees.
                                example: true
                                type: boolean
                          AdditionalInfo:
                            description: If `true`, receives additional tags with information on fare flexibility.
                            example: true
                            type: boolean
                      Taxes:
                        description: Used to exempt taxes.
                        properties:
                          NoTax:
                            description: Used to specify whether or not to exempt all taxes during EMD issuance.
                            properties:
                              Ind:
                                description: If `true`, exempts all taxes during EMD issuance.
                                example: true
                                type: boolean
                          TaxExempt:
                            description: Used to specify a tax code to exempt during EMD issuance.
                            type: array
                            items:
                              properties:
                                Code:
                                  description: Used to specify a tax code to exempt during EMD issuance.
                                  example: 'GB'
                                  type: string
                            minItems: 0
                            maxItems: 5
                      ValidityDates:
                        description: Used to specify ticket validity dates. Can't be combined with `PhaseIV`.
                        type: array
                        items:
                          properties:
                            NotValidAfter:
                              description: Used to specify the ending validity date.
                              example: '2024-12-31'
                              type: string
                              pattern: (((((0[1-9])|(1[0-2]))-((0[1-9])|(1\d)|(2[0-9])))|((((0[13578])|(1[02]))-31)|(((0[1,3-9])|(1[0-2]))-30)))|(((19|20)(([02468][048])|([13579][26]))-02-29))|((20[0-9][0-9])|(19[0-9][0-9]))-((((0[1-9])|(1[0-2]))-((0[1-9])|(1\d)|(2[0-8])))|((((0[13578])|(1[02]))-31)|(((0[1,3-9])|(1[0-2]))-(29|30)))))
                            NotValidBefore:
                              description: Used to specify the beginning validity date.
                              example: '2024-12-31'
                              type: string
                              pattern: (((((0[1-9])|(1[0-2]))-((0[1-9])|(1\d)|(2[0-9])))|((((0[13578])|(1[02]))-31)|(((0[1,3-9])|(1[0-2]))-30)))|(((19|20)(([02468][048])|([13579][26]))-02-29))|((20[0-9][0-9])|(19[0-9][0-9]))-((((0[1-9])|(1[0-2]))-((0[1-9])|(1\d)|(2[0-8])))|((((0[13578])|(1[02]))-31)|(((0[1,3-9])|(1[0-2]))-(29|30)))))
                            Segment:
                              description: Used to specify the relevant itinerary segments.
                              type: array
                              items:
                                properties:
                                  EndNumber:
                                    description: Used to specify end number in range.
                                    example: 3
                                    type: integer
                                    format: int32
                                  Number:
                                    description: Used to specify segment number.
                                    example: 1
                                    type: integer
                                    format: int32
                                required:
                                  - Number
                              minItems: 1
                          required:
                            - Segment
                        minItems: 0
              minItems: 1
              maxItems: 99
            PostProcessing:
              type: object
              description: Additional ticket issuance options, mostly related to post issuance actions.
              properties:
                EndTransaction:
                  description: Used to end the transaction and finalize the record.
                  properties:
                    generateSingleInvoice:
                      description: |
                        If `true`, the API sends a single commit message after issuing multiple tickets.
                        
                        This alters the default mechanism in which each ticket is committed to the PNR immediately after issuance.
                      example: false
                      type: boolean
                    Source:
                      description: Used to receive the record.
                      properties:
                        ReceivedFrom:
                          description: Used to receive the record.
                          example: 'SWS TESTING'
                          type: string
                      required:
                        - ReceivedFrom
                    InvoiceOption:
                      description:
                        Contains parameters used to request the issuance of an invoice document.
                        Mainly applies to low-cost airline booking fulfillment (Sabre Air Connect).
                        Can't be combined with `ItineraryOption`.
                      properties:
                        Ind:
                          description: If `true`, requests the issuance of an invoice document.
                          example: true
                          type: boolean
                      required:
                        - Ind
                    ItineraryOption:
                      description:
                        Contains parameters used to request the issuance of an itinerary document.
                        Mainly applies to low-cost airline booking fulfillment (Sabre Air Connect).
                        Can't be combined with `InvoiceOption`.
                      properties:
                        Ind:
                          description: If `true`, requests the issuance of an itinerary document.
                          example: true
                          type: boolean
                      required:
                        - Ind
                    Email:
                      description: Used to send an email notification upon end transaction to any email addresses contained within the particular record.
                      properties:
                        eTicket:
                          description: Used to send an email notification containing a text-based copy of the eTicket. Can't be combined with `.../Invoice` or `.../Itinerary`.
                          properties:
                            PDF:
                              description: Used to send an email notification containing a PDF-based copy of the eTicket.
                              properties:
                                Ind:
                                  description: If `true`, requests a PDF copy of the eTicket.
                                  example: true
                                  type: boolean
                              required:
                                - Ind
                            Ind:
                              description: If `true`, sends an email notification containing a text-based copy of the eTicket.
                              example: true
                              type: boolean
                          required:
                            - Ind
                        Invoice:
                          description: Used to send an email notification containing a text-based copy of the invoice. Can't be combined with `.../eTicket` or `.../Itinerary`.
                          properties:
                            Ind:
                              description: If `true`, adds a text-based copy of the invoice to the email notification.
                              example: true
                              type: boolean
                          required:
                            - Ind
                        Itinerary:
                          description: Used to send an email notification containing a text-based copy of the itinerary. Can't be combined with `.../eTicket` or `.../Invoice`.
                          properties:
                            PDF:
                              description: Used to send an email notification containing a PDF-based copy of the itinerary.
                              properties:
                                Ind:
                                  description: If `true`, sends an email notification containing a PDF-based copy of the itinerary.
                                  example: true
                                  type: boolean
                              required:
                                - Ind
                            Segment:
                              type: array
                              items:
                                properties:
                                  EndNumber:
                                    description: Used to specify an ending segment in the range to include in the email message.
                                    example: 1
                                    type: integer
                                    format: int32
                                  Number:
                                    description: Used to specify a segment number to include in the email message.
                                    example: 2
                                    type: integer
                                    format: int32
                                required:
                                  - Number
                              minItems: 0
                            Ind:
                              description: If `true`, sends an email notification containing a text-based copy of the itinerary.
                              example: true
                              type: boolean
                          required:
                            - Ind
                        PersonName:
                          properties:
                            NameNumber:
                              description: |
                                Used to specify a particular passenger name number to send the email notification to.
                                The email address in the PNR's email field must be name-associated to the specified name number.
                              example: '2.1'
                              type: string
                          required:
                            - NameNumber
                        Ind:
                          description: If `true`, sends an email notification upon end transaction.
                          example: true
                          type: boolean
                      required:
                        - Ind
                GhostTicketCheck:
                  properties:
                    waitInterval:
                      description: Used to specify interval of time that system will wait.
                      example: 1000
                      type: integer
                      format: int32
                      maximum: 30000
                      minimum: 1000
                    numAttempts:
                      description: Used to specify how many times GhostTicket will be checked.
                      example: 2
                      type: integer
                      format: int32
                      maximum: 6
                      minimum: 1
                TicketingInterval:
                  description: |
                    Specifies the wait interval before the second and then to any subsequent ticketing operations.
                    For example, if you send four `/Ticketing` nodes, the system will perform four ticketing issuance operations.
                    In this case the delay is set after the first, second, and third operation.
                  properties:
                    waitInterval:
                      description: Used to specify an interval that the system should wait in milliseconds.
                      example: 1000
                      type: integer
                      format: int32
                      maximum: 5000
                      minimum: 1000
                    includeFirst:
                      description: If `true`, triggers the Ticketing Interval logic for first ticketing transaction.
                      example: true
                      type: boolean
                CreditVerificationInterval:
                  description: If `true`, specifies the wait interval before committing the changes to the ticket in the instance of system encountering `CREDIT VERIFICATION` message.
                  properties:
                    waitInterval:
                      description: The duration of the wait interval in milliseconds.
                      example: 4000
                      type: integer
                      format: int32
                      maximum: 10000
                      minimum: 3000
                acceptNegotiatedFare:
                  description: If `true`, accepts a negotiated fare when it's impossible to ticket the stored fare.
                  example: true
                  type: boolean
                acceptPriceChanges:
                  description: If `true`, issues a ticket even if the price increases while processing.
                  example: true
                  type: boolean
                actionOnPQExpired:
                  description: Used to specify appropriate action when Price Quote expires. Available options are "R" - reprice, "Q" Quit, "O" Override.
                  example: 'O'
                  type: string
                  enum:
                    - O
                    - Q
                    - R
                actionOnBackDatePrice:
                  description: |
                    Used to specify appropriate action when Price Quote contains back date price. Available options are "R" - reprice, "Q" Quit, "O" Override.
                    If no action is specified, system will automatically perform the reprice.
                  example: 'Q'
                  type: string
                  enum:
                    - O
                    - Q
                    - R
            Diagnostics:
              type: object
              properties: { }
            haltOnInvalidMCT:
              description: |
                If `true`, the API stops processing upon encountering an error indicating
                that the minimum connection time between air itinerary segments isn't met.
              example: true
              type: boolean
            targetCity:
              description: |
                Used to specify to which city service should change context using ContextChange (AAA) and the rest of the service uses new security.
                If empty or equals current city the context doesn't change.
              example: 'AAAA'
              type: string
            healthCheck:
              description: |
                This is for Sabre internal use only.
                
                If `true`, the API is queried in health check mode and returns a blank success that doesn't invoke downstream providers.
              example: 'false'
              type: string
            version:
              description: Used to specify API version.
              example: '1.3.0'
              type: string
              minLength: 1
              maxLength: 255
          required:
            - Itinerary
            - Ticketing

    EnhancedAirTicketResponse:
      type: object
      properties:
        Links:
          type: array
          description: Lists hypertext application language links.
          items:
            properties:
              rel:
                type: string
                example: 'self'
                description: Describes relationship between href and current request.
              href:
                type: string
                example: 'https://api.cert.platform.sabre.com/v1.3.0/air/ticket'
                description: Link to related API request.
        AirTicketRS:
          type: object
          description: Orchestrated Air Ticket API response.
          properties:
            ApplicationResults:
              type: object
              description: ApplicationResults can be used anywhere where Results is referenced, specifically as the contents of a Sabre SOAP Fault/detail element.
              properties:
                Success:
                  description: Lists details of a successful call.
                  type: array
                  items:
                    properties:
                      SystemSpecificResults:
                        $ref: "#/components/schemas/SystemSpecificResults"
                      type:
                        description: An indication of the source of error when processing the request.
                        type: string
                        pattern: \c+
                        enum:
                          - Transport
                          - Validation
                          - Application
                          - BusinessLogic
                      timeStamp:
                        type: string
                  minItems: 0
                  maxItems: 99
                Error:
                  description: Lists details of any errors encountered during processing.
                  type: array
                  items:
                    properties:
                      SystemSpecificResults:
                        $ref: "#/components/schemas/SystemSpecificResults"
                      type:
                        description: An indication of the source of error when processing the request.
                        type: string
                        pattern: \c+
                        enum:
                          - Transport
                          - Validation
                          - Application
                          - BusinessLogic
                      timeStamp:
                        type: string
                  minItems: 0
                  maxItems: 99
                Warning:
                  description: |
                    Lists details of any issues encountered during processing.
                    
                    Use this information to help troubleshoot further.
                  type: array
                  items:
                    properties:
                      SystemSpecificResults:
                        $ref: "#/components/schemas/SystemSpecificResults"
                      type:
                        description: An indication of the source of error when processing the request.
                        type: string
                        pattern: \c+
                        enum:
                          - Transport
                          - Validation
                          - Application
                          - BusinessLogic
                      timeStamp:
                        type: string
                  minItems: 0
                  maxItems: 99
                status:
                  description: Transaction status.
                  type: string
                  enum:
                    - Complete
                    - Incomplete
                    - NotProcessed
                    - Unknown
              required:
                - status
            Summary:
              description: This element is used to return a summary information about the documents that were found.
              type: array
              items:
                properties:
                  DocumentNumber:
                    description: Used to specify serial number.
                    example: '8298200110468'
                    type: string
                  LocalIssueDateTime:
                    description: Used to specify issue date and time - in local time zone of the station that issued it.
                    example: '2024-09-08T16:11:32.000Z'
                    type: string
                  DocumentType:
                    description: Used to specify type of the document. Possible values are TKT, MSR and EMD.
                    example: 'TKT'
                    type: string
                  IssuingLocation:
                    description: Used to specify station location code (usually city code) of the station that issued the document.
                    example: 'G7HE'
                    type: string
                  Reservation:
                    description: Used to specify PNR locator of the PNR containing this document. Returned if the document is a part of a PNR.
                    properties:
                      content:
                        description: Used to specify Passenger Name Record (PNR) locator of the PNR containing this document. Returned if the document is a part of a PNR.
                        example: 'DHTYAF'
                        type: string
                      provider:
                        description: Used to inform about the code of the airline that owns the PNR. Optional.
                        example: 'SY'
                        type: string
                      purgeDate:
                        description: Used to specify purge date informs about the purge date of the PNR. Optional.
                        example: '2024-12-17T09:30:47Z'
                        type: string
                      createDate:
                        description: Used to inform about the creation date of the PNR. Optional.
                        example: '2024-12-17T09:30:47Z'
                        type: string
                  FirstName:
                    description: Used to specify first name of the customer.
                    example: 'ADAM'
                    type: string
                  LastName:
                    description: Used to specify last name (family name or surname) of the customer.
                    example: 'JONES'
                    type: string
                  DocumentStatus:
                    description: |
                      DocumentStatus is used to specify status of the document found (of the whole document, not particular coupon).

                      Possible values: V - VOIDED E - EXCHANGED R - REFUNDED.
                    example: 'V'
                    type: string
                  TotalAmount:
                    description: Used to describe amount of money paid for this document.
                    properties:
                      content:
                        description: Used to specify amount of money paid.
                        example: '60.0'
                        type: string
                      currencyCode:
                        description: Used to specify the code of the currency in which the amount is expressed.
                        example: 'USD'
                        type: string
                      decimalPlace:
                        description: Used to indicate the number of decimal places required by the currency.
                        example: 2
                        type: integer
                        format: int32
                  committed:
                    description: If `true`, the ticket number has been commited to the face of the PNR.
                    example: true
                    type: boolean
              minItems: 0
            Diagnostics:
              type: object
              description: For internal use only.
              properties:
                ESSM_Data:
                  type: object
                  description: For internal use only.
                  properties:
                    AutoEnd:
                      description: For internal use only.
                      example: true
                      type: boolean
                    AutoEndAndRetrieve:
                      description: For internal use only.
                      example: true
                      type: boolean
                    AbacusPrimeHost:
                      description: For internal use only.
                      example: true
                      type: boolean
                    InfiniPrimeHost:
                      description: For internal use only.
                      example: true
                      type: boolean
                    AutoEndDetected:
                      description: For internal use only.
                      example: true
                      type: boolean
                    PrevSimulChgTty:
                      description: For internal use only.
                      example: true
                      type: boolean
                  required:
                    - AutoEnd
                    - AutoEndAndRetrieve
                    - AbacusPrimeHost
                    - InfiniPrimeHost
                    - AutoEndDetected
                    - PrevSimulChgTty
              required:
                - ESSM_Data
            version:
              description: Used to indicate version of the payload message.
              example: '1.3.0'
              type: string
              minLength: 1
              maxLength: 255

    SystemSpecificResults:
      description: Lists specific information from the system and/or other sub-systems invoked during processing.
      type: array
      items:
        properties:
          HostCommand:
            description: Contains the host system command run to create this result.
            type: object
            properties:
              content:
                type: string
                minLength: 0
                maxLength: 4096
              LNIATA:
                description: |
                  An abbreviation for Line / Interface Adapter / Terminal Address.

                  A three-byte terminal address, usually seen as a six-character hexadecimal field.
                example: '0358DC'
                type: string
          Message:
            description: |
              Lists application-specific codes and messages.
              
              Refers to a text-based description that provides more information about a specific condition, warning, or error, and is accompanied by a code attribute as a numeric value.
            type: array
            items:
              properties:
                content:
                  type: string
                  minLength: 0
                  maxLength: 4096
                code:
                  type: string
            minItems: 0
            maxItems: 99
          ShortText:
            description: An abbreviated version of the error in textual format.
            type: string
            minLength: 1
            maxLength: 128
          Element:
            description: |
              May identify an unknown or misspelled tag that caused a processing error.
              If more than one tag with the same name is present in the document, use the XPath notation in the `Tag` parameter to identify the location of a tag.
              Alternatively, the tag name alone can be used to identify missing data (`Type=ReqFieldMissing`).
            type: string
            minLength: 0
            maxLength: 4096
          RecordID:
            description: |
              Allows for batch processing and identification of the record that failed amongst a group of records.
              May be a concatenation of a unique failed transaction ID with specific records associated with that transaction.
            type: string
            minLength: 1
            maxLength: 255
          DocURL:
            description: If present, this attribute refers to an online description of the error that occurred.
            type: string
          timeStamp:
            type: string
          reference:
            description: If present, this attribute provides an XML IDREF to the element for which the results apply.
            type: string
      minItems: 0
      maxItems: 99

