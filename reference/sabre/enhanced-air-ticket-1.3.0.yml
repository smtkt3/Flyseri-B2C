                              properties:
                                EndNumber:
                                  description: Used to select a range of name numbers.
                                  example: 3
                                  type: integer
                                  format: int32
                                NameNumber:
                                  description: Used to select name number.
                                  example: '1.1'
                                  type: string
                                Number:
                                  description: Used to select line number.
                                  example: 1
                                  type: integer
                                  format: int32
