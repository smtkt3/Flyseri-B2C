                                        example: '10.00'
                                        type: string
                                      Number:
                                        description: Used to specify the credit card number.
                                        example: 373912345621003
                                        type: integer
                                        format: int64
                                    required:
                                      - Code
                                      - ExpireDate
                                      - Number
                                  Suppress:
                                    description: If `true`, suppresses credit card information on an itinerary.
                                    example: true
                                    type: boolean
                                required:
                                  - PaymentCard
                          CC_Two:
                            description: Used to specify second payment card details.
                            properties:
                              CC_Info:
                                description: Used to specify payment card details.
                                properties:
                                  PaymentCard:
                                    description: Used to specify payment card details.
                                    properties:
                                      Code:
                                        description: Used to specify the credit card vendor code.
                                        example: 'VI'
                                        type: string
                                      CardSecurityCode:
                                        description: Used to specify the credit card security code.
                                        example: '123'
                                        type: string
                                      ExpireDate:
                                        description: |
                                          ExpireDate is used to specify the credit card expiration date, follows this format: YYYY-MM.
                                        example: '2016-12'
                                        type: string
                                        pattern: '\d{4}-\d{2}'
                                      ExtendedPayment:
                                        description: Used to specify extended payment if applicable.
                                        example: 12
                                        type: integer
                                        format: int32
                                      ManualApprovalCode:
                                        description: Used to specify a manual credit card if applicable.
                                        example: '5678'
                                        type: string
                                      ManualOBFee:
                                        description: |
                                          Used to indicate that the manual OB fee should be associated with the card.
                                          A manual OB fee can ONLY be added to a ticketing entry that references a PQ that has the ''PRICE-MANUAL'' tag at the bottom of the *PQ.
                                        example: '5.00'
                                        type: string
                                      Number:
                                        description: Used to specify the credit card number.
                                        example: 4537156488578956
                                        type: integer
                                        format: int64
                                    required:
                                      - Code
                                      - ExpireDate
                                      - Number
                                  Suppress:
                                    description: If `true`, suppresses credit card information on an itinerary.
                                    example: true
                                    type: boolean
                                required:
                                  - PaymentCard
                        required:
