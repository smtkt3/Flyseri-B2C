# https://developer.sabre.com/rest-api/enhanced-air-ticket/1.3.0
---
openapi: 3.0.0
info:
  title: Enhanced Air Ticket
  version: 1.3.0
  description: The Enhanced Air Ticket API is used to issue one or multiple air tickets and/or EMDs (Electronic Miscellaneous Documents) within a single API call.
paths:
  /v1.3.0/air/ticket:
    post:
      tags:
        - Enhanced Air Ticket
      operationId: enhancedAirTicket
      description: The Enhanced Air Ticket (AirTicketRQ) API is used to issue air tickets, and electronic miscellaneous documents (EMDs) in one request.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnhancedAirTicketRequest"
            examples:
              1. Ticket using a credit card:
                $ref: '#/components/examples/requestExample'
      responses:
        "200":
          description: HTTP 200 OK success status response code indicates that the request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnhancedAirTicketResponse"
              examples:
                1. Tickets using a credit card:
                  $ref: '#/components/examples/responseExample'
        "400":
          description: |
            Bad Request

            - The request wasn't valid.
security:
  - oauth2_authentication: []
tags:
  - name: Enhanced Air Ticket
    description: The Enhanced Air Ticket API is used to issue one or multiple air tickets and/or EMDs (Electronic Miscellaneous Documents) within a single API call.
servers:
  - url: https://api.cert.platform.sabre.com
components:
  securitySchemes:
    oauth2_authentication:
      type: oauth2
      x-base64-encode-client-credentials: true
      flows:
        clientCredentials:
          tokenUrl: https://api.cert.platform.sabre.com/v2/auth/token
          scopes: {}
  schemas:
    EnhancedAirTicketRequest:
      type: object
      properties:
        AirTicketRQ:
          type: object
          description: Orchestrated Air Ticket API request.
          properties:
            DesignatePrinter:
              type: object
              description: Used to control printer designation process.
              properties:
                Printers:
                  description: Used to designate printers.
                  properties:
                    BagTag:
                      description: Used to specify bag tag printer.
                      properties:
                        LNIATA:
                          description: Used to specify a bag tag printer address.
                          example: 'XXXXX9'
                          type: string
                    BoardingPass:
                      description: Used to specify boarding pass of printer.
                      properties:
                        HostedCarrier:
                          description: If `true`, indicates a request for an airline-based boarding pass printer. Used by airline customers.
                          example: true
                          type: boolean
                        LNIATA:
                          description: Used to specify a boarding pass printer address.
                          example: 'XXXXX9'
                          type: string
                    Hardcopy:
                      description: Used to specify the hardcopy printer.
                      properties:
                        Spacing:
                          description: Used to specify the spacing, either 1, or 2.
                          example: '1'
                          type: string
                          enum:
                            - '1'
                            - '2'
                        LNIATA:
                          description: Used to specify a hardcopy printer address.
                          example: 'XXXXX9'
                          type: string
                    InvoiceItinerary:
                      description: Used to specify invoice/itinerary printer.
                      properties:
                        LNIATA:
                          description: Used to specify an invoice/itinerary printer address.
                          example: 'XXXXX9'
                          type: string
                    ListLabel:
                      description: Used to specify list/label printer.
                      properties:
                        LNIATA:
                          description: Used to specify a list/label printer address.
                          example: 'XXXXX9'
                          type: string
                    MiniItinerary:
                      description: Used to specify mini itinerary printer.
                      properties:
                        LNIATA:
                          description: Used to specify a mini itinerary printer address.
                          example: 'XXXXX9'
                          type: string
                    Report:
                      description: Used to specify report printer.
                      properties:
                        LNIATA:
                          description: |
                            Used to specify a report printer address.
                            The user account attempting to designate to a report printer must be signed in under duty code `9`.
                            To set duty code `9`, the client application can utilize the ContextChangeLLSRQ service.
                          example: 'XXXXX9'
                          type: string
                    Ticket:
                      description: Used to specify ticket printer.
                      properties:
                        MiniItinerary:
                          description: Used by ATB1 or ATB2 customers to also designate a mini itinerary printer at the same time they're designating their ticket printer.
                          properties:
                            LNIATA:
                              description: Used by ATB1 or ATB2 customers to also designate a mini itinerary printer at the same time they're designating their ticket printer.
                              example: 'XXXXX9'
                              type: string
                        Remote:
                          description: Used by customers to designate an ATB or ATB2 ticket printer along with a remote printer.
                          properties:
                            LNIATA:
                              description: Used by customers to designate an ATB or ATB2 ticket printer along with a remote printer.
                              example: 'XXXXX9'
                              type: string
                        CountryCode:
                          description: Used to specify country code associated with the airport code.
                          example: 'AB'
                          type: string
                        LNIATA:
                          description: |
                            Used to specify a ticket printer address.
                            Clients should only associate 255 sessions to a single printer address.
                            Additional sessions beyond the initial 255 need to be designated to a different printer address.
                          example: 'XXXXX9'
                          type: string
                Profile:
                  type: object
                  description: Used to pass printer profile information.
                  properties:
                    Number:
                      description: Used to specify a previously established printer number.
                      example: 1
                      type: integer
                      format: int32
            Itinerary:
              type: object
              description: Used to pass record locator of the reservation to issue tickets from.
              properties:
                ID:
                  description: Used to specify a record locator.
                  example: 'YYABHF'
                  type: string
                  pattern: '[0-9a-zA-Z]{1,6}'
              required:
                - ID
            AccountingLines:
              type: object
              description: |
                Used to control accounting line deletion prior ticketing. 
                
                As a default logic, the API will always attempt to delete all accounting lines prior ticketing. 
                
                However, if you wish the system to behave differently you may request to delete specific accounting line numbers only (`Number`, `EndNumber`) or prevent the deletion altogether: (`None`).
              properties:
                Delete:
                  description: Used to specify accounting line numbers to be deleted.
                  type: array
                  items:
                    properties:
                      EndNumber:
                        description: Used with @Number to specify a range of accounting lines to delete.
                        example: 2
                        type: integer
                        format: int32
                      Number:
                        description: Used to specify particular accounting lines.
                        example: 1
                        type: integer
                        format: int32
                    required:
                      - Number
                  minItems: 0
                All:
                  description: If `true`, deletes all accounting lines. Can't be combined with `None`.
                  example: true
                  type: boolean
                None:
                  description: If `true`, doesn't delete any of the accounting lines. Can't be combined with `All`.
                  example: false
                  type: boolean
            Ticketing:
              description: Used to repeat the node as many times as many tickets/ ticket types/EMDs are to be issued.
              type: array
              items:
                properties:
                  FlightQualifiers:
                    description: Used to pass flight related qualifiers.
                    properties:
                      VendorPrefs:
                        description: Used to pass an airline code to issue tickets for - optional.
                        properties:
                          Airline:
                            description: Used to specify the airline.
                            properties:
                              Code:
                                description: Used to specify a particular vendor code.
                                example: 'XX'
                                type: string
                            required:
                              - Code
                        required:
                          - Airline
                  FOP_Qualifiers:
                    description: Used to pass form of payment related qualifiers.
                    properties:
                      BasicFOP:
                        description: Can't be combined with `.../BSP_Ticketing`, `.../SabreSonicTicketing`, or `.../Multiple CC_FOP`.
                        properties:
                          CC_Info:
                            description: Used to specify payment card details.
                            properties:
                              PaymentCard:
                                description: Used to specify payment card details.
                                properties:
                                  Code:
                                    description: Used to specify the credit card vendor code.
                                    example: 'VI'
                                    type: string
                                  CardSecurityCode:
                                    description: Used to specify the credit card security code.
                                    example: '123'
                                    type: string
                                  ExpireDate:
                                    description: |
                                      ExpireDate is used to specify the credit card expiration date, follows this format: YYYY-MM.
                                    example: '2012-12'
                                    type: string
                                    pattern: '\d{4}-\d{2}'
                                  ExtendedPayment:
                                    description: Used to specify extended payment if applicable.
                                    example: 12
                                    type: integer
                                    format: int32
                                  ManualApprovalCode:
                                    description: Used to specify a manual credit card approval code if applicable.
                                    example: '1234'
                                    type: string
                                  ManualOBFee:
                                    description: Used to indicate that the manual OB fee should be associated with the card.
                                    example: '10.00'
                                    type: string
                                  Number:
                                    description: Used to specify the credit card number.
                                    example: 4123412341234123
                                    type: integer
                                    format: int64
                              Suppress:
                                description: If `true`, suppresses credit card information on an itinerary.
                                example: true
                                type: boolean
                            required:
                              - PaymentCard
                          CostCenter:
                            description: Used to pass cost center information. Can't be combined with `Reference` and `Virtual`.
                            example: '123456789123'
                            type: string
                          Reference:
                            description: |
                              Used to refer a line number from PNR Form of Payment (FOP) field.
                              This capability is only available once the agency has activated Sabre's new FOP functionality in the corresponding PCC (TJR setting: PNAPNR),
                              for additional information please contact your Sabre Account Team.
                            example: 1
                            type: integer
                            format: int32
                          Type:
                            description: |
                              Used to specify the payment type.
                              Acceptable values are `CA` (cash), `CK` (check), `CQ` (cheque).
                              If utilizing a credit card please omit @Type, and populate the .../CC_Info child node.
                            example: 'CK'
                            type: string
                          Virtual:
                            description: Used to pass virtual form of payment information.
                            example: 'SABREAIRONETWOFOUR'
                            type: string
                      BSP_Ticketing:
                        description: Used to specify valid for BSP-based clients.
                        properties:
                          MultipleFOP:
                            description: Can't be combined with `.../MultipleMiscFOP` or `.../PayLaterPlan`.
                            properties:
                              Fare:
                                description: Used to specify the amount to be applied to the second FOP.
                                properties:
                                  Amount:
                                    description: Used to specify the amount to be applied to the second FOP.
                                    example: '100.00'
                                    type: string
                                required:
                                  - Amount
                              FOP_One:
                                description: Used to specify form of payment.
                                properties:
                                  CC_Info:
                                    description: Used to specify payment card details.
                                    properties:
                                      PaymentCard:
                                        description: Used to specify payment card details.
                                        properties:
                                          Code:
                                            description: Used to specify the credit card vendor code.
                                            example: 'AX'
                                            type: string
                                          CardSecurityCode:
                                            description: Used to specify the credit card security code.
                                            example: '123'
                                            type: string
                                          ExpireDate:
                                            description: |
                                              ExpireDate is used to specify the credit card expiration date, follows this format: YYYY-MM.
                                            example: '2012-11'
                                            type: string
                                            pattern: '\d{4}-\d{2}'
                                          ExtendedPayment:
                                            description: Used to specify extended payment if applicable.
                                            example: 12
                                            type: integer
                                            format: int32
                                          ManualApprovalCode:
                                            description: Used to specify a manual credit card approval code if applicable.
                                            example: '1234'
                                            type: string
                                          ManualOBFee:
                                            description: |
                                              Used to indicate that the manual OB fee should be associated with the card.
                                              A manual OB fee can ONLY be added to a ticketing entry that references a PQ that has the PRICE-MANUAL tag at the bottom of the *PQ.
                                            example: '10.00'
                                            type: string
                                          Number:
                                            description: Used to specify the credit card number.
                                            example: 373912345621003
                                            type: integer
                                            format: int64
                                      Suppress:
                                        description: If `true`, suppresses credit card information on an itinerary.
                                        example: true
                                        type: boolean
                                    required:
                                      - PaymentCard
                                  Type:
                                    description: |
                                      Used to specify the payment type. Can be `CA`, `CK`, or `CQ`.
                                      If utilizing a credit card, omit `Type` and populate the `.../CC_Info` child node.
                                    example: 'CA'
                                    type: string
                                  Reference:
                                    description: Used to refer a line number from PNR FOP field.
                                    example: 1
                                    type: integer
                                    format: int32
                              FOP_Two:
                                description: Used to specify second form of payment.
                                properties:
                                  CC_Info:
                                    description: Used to specify payment card details.
                                    properties:
                                      PaymentCard:
                                        description: Used to specify payment card details.
                                        properties:
                                          Code:
                                            description: Used to specify the credit card vendor code.
                                            example: 'AX'
                                            type: string
                                          CardSecurityCode:
                                            description: Used to specify the credit card security code.
                                            example: '123'
                                            type: string
                                          ExpireDate:
                                            description: |
                                              ExpireDate is used to specify the credit card expiration date, follows this format: YYYY-MM.
                                            example: '2012-11'
                                            type: string
                                            pattern: '\d{4}-\d{2}'
                                          ExtendedPayment:
                                            description: Used to specify extended payment if applicable.
                                            example: 12
                                            type: integer
                                            format: int32
                                          ManualApprovalCode:
                                            description: Used to specify a manual credit card approval code if applicable.
                                            example: '5678'
                                            type: string
                                          ManualOBFee:
                                            description: |
                                              Used to indicate that the manual OB fee should be associated with the card.
                                              A manual OB fee can ONLY be added to a ticketing entry that references a PQ that has the PRICE-MANUAL tag at the bottom of the *PQ.
                                            example: '5.00'
                                            type: string
                                          Number:
                                            description: Used to specify the credit card number.
                                            example: 373912345621003
                                            type: integer
                                            format: int64
                                      Suppress:
                                        description: If `true`, suppresses credit card information on an itinerary.
                                        example: true
                                        type: boolean
                                    required:
                                      - PaymentCard
                                  Type:
                                    description: |
                                      Used to specify the payment type. Can be `CA`, `CK`, or `CQ`.
                                      If utilizing a credit card, omit `Type` and populate the `.../CC_Info` child node.
                                    example: 'CK'
                                    type: string
                                  Reference:
                                    description: Used to refer a line number from PNR FOP field.
                                    example: 1
                                    type: integer
                                    format: int32
                              Taxes:
                                description: Used to pass tax details.
                                properties:
                                  Tax:
                                    description: Used to specify individual tax details.
                                    type: array
                                    items:
                                      properties:
                                        Amount:
                                          description: Used to specify the tax amount.
                                          example: '5.00'
                                          type: string
                                        TaxCode:
                                          description: Used to specify the tax code.
                                          example: 'GB'
                                          type: string
                                      required:
                                        - Amount
                                        - TaxCode
                                    minItems: 1
                                    maxItems: 3
                                required:
                                  - Tax
                            required:
                              - Fare
                              - FOP_One
                              - FOP_Two
                          MultipleMiscFOP:
                            description: Can't be combined with `.../MultipleFOP` or `.../PayLaterPlan`.
                            properties:
                              Fare:
                                description: Used to specify the amount to be applied to the second FOP.
                                properties:
                                  Amount:
                                    description: Used to specify the fare amount to be applied to the second FOP.
                                    example: '300.00'
                                    type: string
                                required:
                                  - Amount
                              FOP_One:
                                description: Used to specify form of payment.
                                properties:
                                  CC_Info:
                                    description: Used to specify payment card details.
                                    properties:
                                      PaymentCard:
                                        description: Used to specify payment card details.
                                        properties:
                                          Code:
                                            description: Used to specify the credit card vendor code.
                                            example: 'MC'
                                            type: string
                                          ExpireDate:
                                            description: |
                                              ExpireDate is used to specify the credit card expiration date, follows this format: YYYY-MM.
                                            example: '2012-11'
                                            type: string
                                            pattern: '\d{4}-\d{2}'
                                          ExtendedPayment:
                                            description: Used to specify extended payment if applicable.
                                            example: 12
                                            type: integer
                                            format: int32
                                          ManualApprovalCode:
                                            description: Used to specify a manual credit card approval code if applicable.
                                            example: '1234'
                                            type: string
                                          Number:
                                            description: Used to specify the credit card number.
                                            example: 12345678999001
                                            type: integer
                                            format: int64
                                        required:
                                          - Code
                                          - ExpireDate
                                          - Number
                                      Suppress:
                                        description: If `true`, suppresses credit card information on an itinerary.
                                        example: true
                                        type: boolean
                                    required:
                                      - PaymentCard
                                  Type:
                                    description: |
                                      Used to specify the payment type. Can be `CA`, `CK`, or `CQ`.
                                      If utilizing a credit card, omit `Type` and populate the `.../CC_Info` child node.
                                    example: 'CK'
                                    type: string
                                  Reference:
                                    description: Used to refer a line number from PNR FOP field.
                                    example: 1
                                    type: integer
                                    format: int32
                              FOP_Two:
                                description: Used to specify second form of payment.
                                properties:
                                  ExtendedPayment:
                                    description: Used to pass number of months for extended payment.
                                    properties:
                                      NumMonths:
                                        description: Used to pass number of months.
                                        example: 11
                                        type: integer
                                        format: int32
                                    required:
                                      - NumMonths
                                  Type:
                                    description: Used to specify the misc payment.
                                    example: 'PL189947'
                                    type: string
                                  Reference:
                                    description: Used to reference a line number from PNR FOP field.
                                    example: 1
                                    type: integer
                                    format: int32
                              Taxes:
                                description: Used to pass tax details.
                                properties:
                                  Tax:
                                    description: Used to specify individual tax details.
                                    type: array
                                    items:
                                      properties:
                                        Amount:
                                          description: Used to specify the tax amount.
                                          example: '30.00'
                                          type: string
                                        TaxCode:
                                          description: Used to specify the tax code.
                                          example: 'XT'
                                          type: string
                                      required:
                                        - Amount
                                        - TaxCode
                                    minItems: 1
                                    maxItems: 2
                                required:
                                  - Tax
                            required:
                              - Fare
                              - FOP_One
                              - FOP_Two
                          PayLaterPlan:
                            description: Only applicable to Brazil. Can't be combined with `MultipleFOP` or `MultipleMiscFOP`.
                            properties:
                              Fare:
                                description: Used to specify the amount to be applied to the second FOP.
                                properties:
                                  Amount:
                                    description: Used to specify the remaining fare amount.
                                    example: '200.00'
                                    type: string
                                required:
                                  - Amount
                              FOP:
                                description: Used to specify form of payment.
                                properties:
                                  CC_Info:
                                    description: Used to specify payment card details.
                                    properties:
                                      PaymentCard:
                                        description: Used to specify payment card details.
                                        properties:
                                          Code:
                                            description: Used to specify the credit card vendor code.
                                            example: 'AX'
                                            type: string
                                          ExpireDate:
                                            description: |
                                              ExpireDate is used to specify the credit card expiration date, follows this format: YYYY-MM.
                                            example: '2012-11'
                                            type: string
                                            pattern: '\d{4}-\d{2}'
                                          ManualApprovalCode:
                                            description: Used to specify a manual credit card approval code if applicable.
                                            example: '23'
                                            type: string
                                          Number:
                                            description: Used to specify the credit card number.
                                            example: 376422221000
                                            type: integer
                                            format: int64
                                        required:
                                          - Code
                                          - ExpireDate
                                          - Number
                                    required:
                                      - PaymentCard
                                  Type:
                                    description: |
                                      Used to specify the payment type. Can be `CA`, `CK`, or `CQ`.
                                      If utilizing a credit card, omit `Type` and populate the `.../CC_Info` child node.
                                    example: 'CA'
                                    type: string
                                  Reference:
                                    description: Used to refer a line number from PNR FOP field.
                                    example: 1
                                    type: integer
                                    format: int32
                              Installment:
                                description: Used to specify the number of installments.
                                properties:
                                  Count:
                                    description: Used to specify the number of installments.
                                    example: '03'
                                    type: string
                                  PayLaterReferenceNumber:
                                    description: Used to specify the pay later reference number.
                                    example: 'XRG065'
                                    type: string
                                  Value:
                                    description: Used to specify the value of the installments. Decimals aren't permitted.
                                    example: '10000'
                                    type: string
                                required:
                                  - Count
                                  - PayLaterReferenceNumber
                                  - Value
                            required:
                              - Fare
                              - FOP
                              - Installment
                      MultipleCC_FOP:
                        description: Can't be combined with `.../BSP_Ticketing` or `.../SabreSonicTicketing`.
                        properties:
                          Fare:
                            description: Used to specify the amount to be applied to the second FOP.
                            properties:
                              Amount:
                                description: Used to specify the amount to be applied to the second CC.
                                example: '100.00'
                                type: string
                            required:
                              - Amount
                          CC_One:
                            description: Used to specify first payment card details.
                            properties:
                              CC_Info:
                                description: Used to specify payment card details.
                                properties:
                                  PaymentCard:
                                    description: Used to specify payment card details.
                                    properties:
                                      Code:
                                        description: Used to specify the credit card vendor code.
                                        example: 'AX'
                                        type: string
                                      CardSecurityCode:
                                        description: Used to specify the credit card security code.
                                        example: '123'
                                        type: string
                                      ExpireDate:
                                        description: |
                                          ExpireDate is used to specify the credit card expiration date, follows this format: YYYY-MM.
                                        example: '2012-11'
                                        type: string
                                        pattern: '\d{4}-\d{2}'
                                      ExtendedPayment:
                                        description: Used to specify extended payment if applicable.
                                        example: 12
