<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500"><rect width="700" height="500" fill="#eaf1f8"/><rect x="102" y="20" width="496" height="460" rx="7" fill="white" stroke="#d0dce8"/><g font-family="Arial,sans-serif"><text x="139" y="62" font-size="12" fill="#1767cc" font-weight="700">FLYSERI · DOCUMENT EXAMPLE</text><text x="139" y="101" font-size="25" fill="#193854" font-weight="700">Covering letter</text><text x="139" y="131" font-size="12" fill="#708299">For the appropriate visa officer / authority</text><path d="M139 151h420" stroke="#dce7f2"/><g fill="#4e6681" font-size="14"><text x="139" y="181">1. Your visit and travel purpose</text><text x="139" y="242">2. Proposed itinerary and accommodation</text><text x="139" y="303">3. Who will pay for the visit</text><text x="139" y="364">4. Relevant supporting circumstances</text></g><g stroke="#dce6ef" stroke-width="7" stroke-linecap="round"><path d="M142 202h407M142 217h350M142 263h407M142 278h300M142 324h407M142 339h340M142 385h407M142 400h300"/></g><text x="139" y="443" font-size="11" fill="#1767cc">Use accurate details matching your application and passport.</text></g><text x="350" y="493" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#708299">LAYOUT EXAMPLE ONLY · NOT AN OFFICIAL FORM</text></svg>
