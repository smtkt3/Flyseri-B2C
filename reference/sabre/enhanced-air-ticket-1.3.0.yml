                        required:
                          - Line
                      Invoice:
                        description: |
                          Used to specify to print invoice at time of ticketing.
                          Both parameters will print a passenger electronic ticketing receipt as well as an invoice.
                        properties:
                          Ind:
                            description: If `true`, prints the invoice.
                            example: true
                            type: boolean
                          ETReceipt:
                            description: If `true`, prints a passenger electronic ticketing receipt at time of ticketing.
                            example: true
                            type: boolean
                      MISF:
                        description: |
                          Used to issue a paperless service fee request, using the service fee amount stored in the TJR.
                          This attribute can be combined with form of payment details .../OptionalQualifiers/FOP_Qualifiers/BasicFOP.
                        properties:
                          Override:
                            properties:
                              Amount:
                                description: Used to issue a paperless service fee request and specify a service fee amount override.
                                example: '5.00'
                                type: string
                              CurrencyCode:
                                description: Used to specify currency.
                                example: 'USD'
                                type: string
                              ServiceFeeDescription:
                                description: Used to add service fee description.
                                example: 'HANN'
                                type: string
                              CustomerReference:
                                description: Used to add customer reference. Applies only to BSP Canada customers.
                                example: 'MBAYE'
                                type: string
                              BackOfficeInfo:
                                description: Used to provide extra back-office information. Equivalent Sabre host command `MISF‡O*ABC123`.
                                type: string
                                example: 'ABC123'
                              DocumentReferenceCode:
                                description: Used to assign a document, reference number, or free text to the transaction. Can't be combined with `TicketNumber`. Equivalent to Sabre host command `MISF‡TM1234567890`.
                                type: string
                                example: '1234567890'
                              TicketNumber:
                                description: Used to assign a ticket number to the transaction. Can't be combined with `DocumentReferenceCode`. Equivalent to Sabre host command `MISF‡T0061234567890`.
                                type: string
                                example: '0061234567890'
                          Ind:
                            description: |
                              If `true`, issues a paperless service fee request using the service fee amount stored in the TJR.
                              Can be combined with form of payment details `/AirTicketRQ/OptionalQualifiers/FOP_Qualifiers/BasicFOP`.
                            example: true
                            type: boolean
                      NeedPrint:
                        description: Only two of the three parameters can be set to `true` simultaneously.
