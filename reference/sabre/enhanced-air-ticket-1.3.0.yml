                          AuditorCoupon:
                            description: If `true`, prints an auditor coupon. Only applicable to Sabre Sonic-hosted carriers.
                            example: true
                            type: boolean
                          Itinerary:
                            description: If `true`, prints an itinerary. Only applicable to Sabre Sonic-hosted carriers.
                            example: true
                            type: boolean
                          PassengerReceipt:
                            description: If `true`, prints a passenger receipt. Only applicable to Sabre Sonic-hosted carriers.
                            example: true
                            type: boolean
                        required:
                          - AuditorCoupon
                          - Itinerary
                          - PassengerReceipt
                      NetRemit:
