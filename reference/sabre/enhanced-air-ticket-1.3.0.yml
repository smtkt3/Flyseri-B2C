                              items:
                                properties:
                                  EndNameNumber:
                                    description: Used to select a range of name numbers.
                                    example: 4.1
                                    type: number
                                    format: float
                                  NameNumber:
                                    description: Used to select a specific name number.
                                    example: 2.1
                                    type: number
